name: Publish to PyPI

# Trusted Publishing — no PyPI API token. The workflow exchanges its GitHub
# OIDC token for a short-lived PyPI upload credential. Configure the trusted
# publisher on PyPI before the first run:
#   https://pypi.org/manage/account/publishing/
#
#   PyPI Project Name: sops-mcp
#   Owner:             privacyplaybook
#   Repository name:   sops-mcp
#   Workflow name:     publish-pypi.yml
#   Environment name:  pypi
#
# Also create a GitHub Environment named `pypi` in repo Settings → Environments
# (deploy-time gate; can also pin allowed branches/tags).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# Least-privilege default; the publish job (id-token: write) and
# create-release job (contents/actions: write) re-grant at the job level.
permissions:
  contents: read

jobs:
  build:
    needs: []
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Gate on a clean dependency vulnerability scan
        uses: ./.github/actions/vuln-scan
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify build artifacts
        run: |
          ls -la dist/
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Nothing ships to PyPI or the Release until publish.yml has published
  # this tag's image: scanned (it pushes nothing that fails the Grype scan
  # or its supply-chain checks), pushed and signed. The proof is a cosign
  # signature on the tag's image from publish.yml at this tag and this
  # commit, the same check as the README's `cosign verify`, pinned tighter.
  # publish.yml runs in parallel on the same tag push and takes minutes, so
  # this waits for it, up to 45 minutes. A tag whose image fails the scan
  # never gets a signature, so it fails here at the deadline.
  # Not a version tag (a dispatch on a branch): fails at once.
  tag-image:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Wait for the tag's image, signed by publish.yml
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/tags/v*) ;;
            *) echo "::error::$REF is not a version tag; nothing is published from it"; exit 1 ;;
          esac
          identity="https://github.com/$REPO/.github/workflows/publish.yml@$REF"
          deadline=$(( $(date +%s) + 45 * 60 ))
          until cosign verify \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              "$IMAGE:$TAG" >/dev/null 2>"$RUNNER_TEMP/cosign.err" </dev/null; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              tail -n 5 "$RUNNER_TEMP/cosign.err"
              echo "::error::no image $IMAGE:$TAG signed by publish.yml at $GITHUB_SHA after 45 minutes; not publishing"
              exit 1
            fi
            sleep 30
          done
          echo "$IMAGE:$TAG is published and signed by publish.yml at $GITHUB_SHA"

  publish:
    needs: [build, tag-image]
    runs-on: ubuntu-latest
    # Pre-release tags (v1.2.3-rc1) build and vuln-scan above, and publish.yml
    # still produces a cosign-signed image for deploy validation — but they do
    # NOT publish to PyPI. The package version is static in pyproject.toml, so
    # an rc tag would otherwise upload the *final* version's wheel prematurely.
    # Only final tags reach PyPI, and never a branch (a manual dispatch).
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    environment:
      name: pypi
      url: https://pypi.org/p/sops-mcp
    permissions:
      id-token: write   # required for OIDC
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Safety net: never fail the release if this version is already on
          # PyPI (e.g. re-run, or it was published out of band). A real
          # "forgot to bump" is still caught by the duplicate being skipped.
          skip-existing: true

  # Create the GitHub Release (notes from CHANGELOG.md) and, for final tags,
  # trigger the MCP registry publish. Runs after `publish` so that — for a
  # final release — the wheel is live before the registry entry (which
  # references it). For a pre-release the `publish` job is skipped, and this
  # still runs to cut the pre-release Release (the reusable workflow does not
  # dispatch the registry for pre-release tags). It runs only when the
  # package build passed and the tag's image is published and signed, and `publish` either
  # succeeded or was skipped for a pre-release tag: a skipped `publish`
  # (whose `needs` failed) no longer lets the Release through.
  create-release:
    needs: [build, tag-image, publish]
    if: >-
      ${{ !cancelled()
          && startsWith(github.ref, 'refs/tags/v')
          && needs.build.result == 'success'
          && needs.tag-image.result == 'success'
          && (needs.publish.result == 'success'
              || (needs.publish.result == 'skipped' && contains(github.ref_name, '-'))) }}
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/create-release.yml
    with:
      tag: ${{ github.ref_name }}
