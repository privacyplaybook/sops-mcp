name: Image build

# Builds the Docker image on every pull request, without pushing it.
# publish.yml builds only after merge, so a base-image or lockfile change
# (a new Python, an sdist that won't compile, a trust-store regression
# caught by lib/check_trust_store.py) would otherwise first fail on main.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Reads the repo only: no registry login, no push, no signing.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
