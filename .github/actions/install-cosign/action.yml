name: Install cosign
description: >
  Put a version- and SHA-256-pinned cosign on PATH, for
  lib/verify_base_images.py, which verifies the base images' signatures
  and fails without it. Runs on x86-64 Linux runners only (the pinned asset
  is cosign-linux-amd64); it fails up front anywhere else.

runs:
  using: composite
  steps:
    - name: Install cosign (version and SHA-256 pinned)
      shell: bash
      # Pinned by version and by the binary's SHA-256, taken from the
      # release's cosign_checksums.txt after verifying that file's Sigstore
      # bundle (signed by Sigstore's release identity). To bump: download
      # cosign-linux-amd64, cosign_checksums.txt and
      # cosign_checksums.txt.sigstore.json from the new release, run
      #   cosign verify-blob --bundle cosign_checksums.txt.sigstore.json \
      #     --certificate-identity keyless@projectsigstore.iam.gserviceaccount.com \
      #     --certificate-oidc-issuer https://accounts.google.com \
      #     cosign_checksums.txt
      # and copy the cosign-linux-amd64 line here. No install script, no
      # third-party action: nothing is fetched that isn't checked.
      env:
        COSIGN_VERSION: "3.1.4"
        COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" != Linux ] || [ "$RUNNER_ARCH" != X64 ]; then
          echo "::error::install-cosign pins the linux-amd64 cosign asset; this runner is $RUNNER_OS/$RUNNER_ARCH"
          exit 1
        fi
        dir="$RUNNER_TEMP/cosign"
        mkdir -p "$dir"
        curl -sSfL --retry 3 -o "$dir/cosign" \
          "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
        echo "${COSIGN_SHA256}  $dir/cosign" | sha256sum --check --strict
        chmod +x "$dir/cosign"
        echo "$dir" >> "$GITHUB_PATH"
